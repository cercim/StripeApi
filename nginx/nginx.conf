worker_processes auto;           # one per vCPU
worker_rlimit_nofile 65535;      # max open files per worker

events {
    worker_connections  10000;   # 8 vCPUs × 10k = 80k concurrent conns
    use                 epoll;
    multi_accept        on;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/json;

    # ── logging ──────────────────────────────────────────────────────────────
    log_format main '$remote_addr | $status | $request_time s | $request';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # ── perf tweaks ───────────────────────────────────────────────────────────
    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;
    keepalive_requests 10000;
    server_tokens      off;

    # ── upstream — uvicorn ────────────────────────────────────────────────────
    upstream gate_backend {
        server gate-api:8000;
        keepalive 512;           # persistent conns to uvicorn pool
    }

    # ── rate limiting (optional safety valve) ─────────────────────────────────
    # 200 req/s per IP — comment out if you don't want it
    limit_req_zone $binary_remote_addr zone=gate:10m rate=200r/s;

    # ── custom error pages ────────────────────────────────────────────────────
    server {
        listen 80;

        # ── health (bypass rate limit) ────────────────────────────────────
        location = /health {
            proxy_pass         http://gate_backend;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
        }

        # ── main gate ─────────────────────────────────────────────────────
        location / {
            limit_req zone=gate burst=500 nodelay;

            proxy_pass          http://gate_backend;
            proxy_http_version  1.1;
            proxy_set_header    Connection        "";
            proxy_set_header    Host              $host;
            proxy_set_header    X-Real-IP         $remote_addr;
            proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;

            # gate takes up to 90s (card check timeout)
            proxy_connect_timeout  10s;
            proxy_send_timeout     95s;
            proxy_read_timeout     95s;

            # nginx queue — holds requests when all workers busy
            proxy_buffering    on;
            proxy_buffer_size  4k;
            proxy_buffers      8 4k;

            # clean JSON 503 when backend is fully slammed
            error_page 502 503 504 @backend_down;
        }

        location @backend_down {
            default_type application/json;
            return 503 '{"status":"error","message":"All workers busy — retry in a moment","reason":"overloaded","time":0}';
        }
    }
}
